<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="sxlShieldBg" x1="256" y1="20" x2="256" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F2942" />
      <stop offset="50%" stop-color="#001A33" />
      <stop offset="100%" stop-color="#000D1A" />
    </linearGradient>
    <linearGradient id="sxlBorder" x1="60" y1="20" x2="452" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0078D4" />
      <stop offset="100%" stop-color="#00A8E8" />
    </linearGradient>
    <linearGradient id="sxlCyan" x1="160" y1="140" x2="352" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#0078D4" />
    </linearGradient>
    <filter id="sxlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Cyber Shield -->
  <path d="M256 20 L448 92 C448 244 368 396 256 492 C144 396 64 244 64 92 Z" 
        fill="url(#sxlShieldBg)" 
        stroke="url(#sxlBorder)" 
        stroke-width="24" 
        stroke-linejoin="round" />

  <!-- Inner Inset Shield Track -->
  <path d="M256 56 L416 116 C416 238 348 368 256 452 C164 368 96 238 96 116 Z" 
        fill="none" 
        stroke="#1E3A5F" 
        stroke-width="6" 
        stroke-dasharray="16 10" 
        opacity="0.8" />

  <!-- ShadowXLab Cyber 'X' Crossed Guard Beams -->
  <path d="M168 152 L344 360" 
        stroke="#00E5FF" 
        stroke-width="28" 
        stroke-linecap="round" 
        filter="url(#sxlGlow)" />
  <path d="M344 152 L168 360" 
        stroke="url(#sxlBorder)" 
        stroke-width="28" 
        stroke-linecap="round" />

  <!-- Central Enterprise Vault Core (Emblem of Privileged Access) -->
  <circle cx="256" cy="256" r="64" fill="#001A33" stroke="#38BDF8" stroke-width="12" />
  <circle cx="256" cy="256" r="44" fill="#0F2942" stroke="#00E5FF" stroke-width="4" />

  <!-- Keyhole / Identity Lock Geometry -->
  <circle cx="256" cy="242" r="16" fill="#FFFFFF" />
  <path d="M246 250 L240 284 L272 284 L266 250 Z" fill="#FFFFFF" />

  <!-- Top Shield Crest Accent -->
  <polygon points="256,36 280,68 232,68" fill="#38BDF8" />
</svg>
